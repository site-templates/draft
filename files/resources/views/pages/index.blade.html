    The homepage. It lives at pages/index.blade.html, so it's served at "/".
    The page is a list of sections: each tag pulls a component from
    resources/views/components/sections/ and fills its props with these
    attributes. In Visual mode you can select, reorder, and edit them
    on the canvas.
-->
<x-layouts.main title="Plan. Ship. Announce." description="Draft is the system of record for product work — issues, cycles, releases, and the changelog your customers actually read.">

    <x-sections.features :items="$features" />

        pointTwo="Publish to a hosted changelog on your domain"
        pointThree="RSS and email digests, built in"
