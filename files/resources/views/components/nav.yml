# The visual editor's contract for components/nav.blade.php — these fields
# surface under the Layout tab. Field names are camelCase, matching the props
# they fill.
title: Navigation
description: The site-wide top bar — brand, links, the Resources dropdown, and the call to action
fields:
    brand:
        type: text
        label: Brand name
        default: "Draft"
    signInText:
        type: text
        label: Sign-in link text
        default: "Sign in"
    signInLink:
        type: url
        label: Sign-in link
        default: "#"
    ctaText:
        type: text
        label: Button text
        default: "Get started"
    ctaLink:
        type: url
        label: Button link
        default: "/pricing"
