@props([
    'eyebrow' => 'Page',
    'heading' => 'Page heading',
    'body' => '',
])
<!--
    The shared opener for interior pages — eyebrow, headline, and an optional
    line of context. Each page passes its own copy on the section tag.
-->
<section class="relative overflow-hidden pt-32 pb-4 sm:pt-40 sm:pb-6">
    <div class="glow pointer-events-none absolute inset-x-0 top-0 h-[24rem]"></div>
    <div class="dot-grid pointer-events-none absolute inset-x-0 top-0 h-[20rem]"></div>

    <div class="relative mx-auto w-full max-w-6xl px-6">
        <p class="font-mono text-[11px] font-medium tracking-widest text-accent uppercase" data-reveal>{{ $eyebrow }}</p>
        <h1 class="reveal-1 mt-4 max-w-[22ch] text-4xl font-semibold tracking-tight text-balance sm:text-[3.25rem] sm:leading-[1.1]" data-reveal>{{ $heading }}</h1>
        @if ($body)
            <p class="reveal-2 mt-5 max-w-[54ch] text-lg/8 text-pretty text-muted" data-reveal>{{ $body }}</p>
        @endif
    </div>
</section>
