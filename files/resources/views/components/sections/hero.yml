# The visual editor's contract for sections/hero.blade.html: each field maps
# to a prop in the component's props. Defaults fill any attribute the page
# doesn't pass. Field names are camelCase, matching the props they fill.
title: Hero
description: The opening statement — a left-aligned monochrome headline, subcopy with an announcement link, and the product window
fields:
    heading:
        type: text
        label: Heading
        default: "The workspace where software ships"
    body:
        type: textarea
        label: Supporting copy
        default: "Purpose-built for the whole delivery loop — issues, cycles, releases, and the changelog your customers actually read."
    newLabel:
        type: text
        label: Announcement label
        description: The bold word before the announcement link.
        default: "New"
    newText:
        type: text
        label: Announcement text
        default: "Draft Agents"
    newLink:
        type: url
        label: Announcement link
        default: "/updates/introducing-draft-agents"
